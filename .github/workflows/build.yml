name: Build Student APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - run: flutter pub get
      - run: dart run flutter_launcher_icons

      - name: Force compileSdk 34 on all plugins
        run: |
          find ~/.pub-cache -type f \( -name "build.gradle" -o -name "build.gradle.kts" \) -exec sed -i -E 's/compileSdk(Version)?(\s*=?\s*)[0-9]+/compileSdk\1\2 34/g' {} +
          find ~/.pub-cache -type f \( -name "build.gradle" -o -name "build.gradle.kts" \) -exec sed -i -E 's/targetSdk(Version)?(\s*=?\s*)[0-9]+/targetSdk\1\2 34/g' {} +

      - name: Build APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: Student-APK-File
          path: build/app/outputs/flutter-apk/app-release.apk
